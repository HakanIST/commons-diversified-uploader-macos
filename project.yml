name: CommonsDiversifiedUploader
options:
  bundleIdPrefix: tr.tall
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: tr
packages:
  UploaderCore:
    path: Packages/UploaderCore
targets:
  CommonsDiversifiedUploader:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: UploaderCore
    settings:
      base:
        PRODUCT_NAME: Commons Diversified Uploader
        PRODUCT_BUNDLE_IDENTIFIER: tr.tall.CommonsDiversifiedUploader
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Commons Diversified Uploader
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "Apache License 2.0"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: RZD6H2LE2U
        CODE_SIGN_STYLE: Automatic
